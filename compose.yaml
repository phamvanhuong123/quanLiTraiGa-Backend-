services:
  app:
    build: .
    container_name: chicken_app_container
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - db
    restart: on-failure

  db:
    image: postgres:17
    container_name: chicken_db_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chicken_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data:
    driver: local